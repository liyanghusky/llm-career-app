<title>跃迁 LLM 训练台</title>
<link rel="stylesheet" href="css/app.css">

<div class="grain"></div>

<header class="topbar">
  <div class="brand">
    <span class="logo">⬡</span>
    <div class="brand-txt">
      <b>跃迁</b>
      <span>LLM 求职训练台</span>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="home"    class="on">总览</button>
    <button data-view="roadmap">路线图</button>
    <button data-view="project">项目库</button>
    <button data-view="bank">题库</button>
    <button data-view="drill">刷卡</button>
    <button data-view="lc">算法题</button>
  </nav>
  <div class="topright">
    <span class="streak" id="streak" title="连续学习天数"></span>
    <button class="ghost" id="btnData" title="导出 / 导入 / 重置进度">⚙</button>
  </div>
</header>

<main id="app"></main>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal">
    <button class="modal-x" id="modalX">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<footer class="foot">
  <span>进度存在本地浏览器 · 每段内容都能问 AI 详解</span>
</footer>

<script src="data/roadmap.js"></script>
<script src="data/projects.js"></script>
<script src="data/questions.js"></script>
<script src="data/lessons1.js"></script>
<script src="data/lessons2.js"></script>
<script src="data/leetcode.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
